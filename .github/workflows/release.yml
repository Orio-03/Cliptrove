name: Release

# Releases itself: when the version in cliptrove/__init__.py goes up on main (and CHANGELOG.md has notes for it),
# this builds Cliptrove.exe, checks it starts, and publishes the zip and its checksum as a new GitHub release.
# Running it by hand (Actions > Release > Run workflow) publishes the current version if it isn't out yet.
on:
  push:
    branches: [main]
    paths: ["cliptrove/__init__.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import cliptrove; print(cliptrove.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released." >> "$GITHUB_STEP_SUMMARY"
          else
            python3 packaging/release_notes.py "v$version" > /dev/null  # fails if CHANGELOG.md has no notes for it
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the Windows app
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover tests
      - name: Install PyInstaller
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Build
        run: python packaging/build_windows.py
      - name: Start it and check the site works
        run: python packaging/smoke_test.py dist/Cliptrove/Cliptrove.exe
      - name: Checksum
        shell: pwsh
        run: Get-ChildItem dist/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Cliptrove-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  publish:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Cliptrove-windows
          path: dist
      - name: Create the release (and its v-tag)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python3 packaging/release_notes.py "v$VERSION" > notes.md
          gh release create "v$VERSION" dist/*.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "Cliptrove $VERSION" --notes-file notes.md
          echo "Published [Cliptrove $VERSION](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION)" >> "$GITHUB_STEP_SUMMARY"
