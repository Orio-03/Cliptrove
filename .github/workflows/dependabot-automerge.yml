name: Dependabot auto-merge

# Dependabot's minor and patch updates (to GitHub Actions and PyInstaller) merge themselves once every check in CI
# has passed. Major updates wait for a person, since they can change how things work.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge once the checks pass
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR"
